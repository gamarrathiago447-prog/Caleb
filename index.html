<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de Ajedrez - Fase de Grupos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#111827] border-b border-gray-800 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
                <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">Torneo de Ajedrez</h1>
                <div class="flex items-center space-x-2 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs text-emerald-400 font-medium">Modo Local Activo</span>
                </div>
            </div>
        </div>
        <div class="bg-gray-800/80 px-4 py-2 rounded-lg border border-gray-700/50 text-sm font-medium text-gray-300">
            Fase de Grupos
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="max-w-4xl mx-auto px-6 mt-6 w-full flex space-x-4 border-b border-gray-800 pb-3">
        <button onclick="switchTab('grupos')" id="btn-grupos" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all bg-amber-500 text-gray-950 shadow-lg shadow-amber-500/20">
            Fase de Grupos
        </button>
        <button onclick="switchTab('resultados')" id="btn-resultados" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white">
            Resultados Registrados
        </button>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-6 flex-grow w-full">
        
        <!-- Tab Grupos -->
        <div id="tab-grupos" class="space-y-8">
            <!-- Disposición Vertical de los Grupos -->
            <div class="flex flex-col space-y-6" id="groups-container">
                <!-- Se inyecta por JS -->
            </div>

            <!-- Leyenda -->
            <div class="bg-gray-900/60 border border-gray-800/80 p-4 rounded-xl flex flex-wrap items-center gap-6 text-sm">
                <span class="font-semibold text-gray-400 uppercase tracking-wider text-xs">LEYENDA:</span>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded bg-sky-500 inline-block"></span>
                    <span class="text-gray-300">Fase de Eliminación Directa</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded bg-amber-500 inline-block"></span>
                    <span class="text-gray-300">Mejores Terceros</span>
                </div>
            </div>
        </div>

        <!-- Tab Resultados -->
        <div id="tab-resultados" class="hidden space-y-6">
            <div class="bg-[#111827] border border-gray-800 rounded-2xl p-6 shadow-xl space-y-6">
                <h2 class="text-lg font-bold text-white border-b border-gray-800 pb-3">Historial de Partidos Jugados</h2>
                <div class="space-y-6" id="matches-list">
                    <!-- Se inyecta por JS agrupado por grupo -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const tournamentData = {
            grupos: {
                "Grupo A": {
                    jugadores: ["Juan", "Adriano", "Enzo", "Thiago"],
                    partidos: [
                        { p1: "Thiago", g1: 2, p2: "Adriano", g2: 0 },
                        { p1: "Juan", g1: 3, p2: "Enzo", g2: 0 },
                        { p1: "Juan", g1: 3, p2: "Adriano", g2: 0 },
                        { p1: "Enzo", g1: 0, p2: "Thiago", g2: 0 },
                        { p1: "Adriano", g1: 1, p2: "Enzo", g2: 0 },
                        { p1: "Juan", g1: 1, p2: "Thiago", g2: 0 }
                    ]
                },
                "Grupo B": {
                    jugadores: ["Chido", "Renato", "Facundo", "Tapir"],
                    partidos: [
                        { p1: "Chido", g1: 1, p2: "Tapir", g2: 0 },
                        { p1: "Renato", g1: 2, p2: "Facundo", g2: 0 },
                        { p1: "Renato", g1: 1, p2: "Tapir", g2: 1 },
                        { p1: "Chido", g1: 2, p2: "Facundo", g2: 0 },
                        { p1: "Tapir", g1: 1, p2: "Facundo", g2: 0 }
                    ]
                },
                "Grupo C": {
                    jugadores: ["Dustyn", "Omar", "Julian", "Mateo"],
                    partidos: [
                        { p1: "Mateo", g1: 2, p2: "Julian", g2: 0 },
                        { p1: "Dustyn", g1: 2, p2: "Omar", g2: 0 },
                        { p1: "Dustyn", g1: 3, p2: "Julian", g2: 0 },
                        { p1: "Mateo", g1: 2, p2: "Omar", g2: 0 }
                    ]
                }
            }
        };

        function calculateStandings(grupoNombre, grupoInfo) {
            let stats = {};
            grupoInfo.jugadores.forEach(j => {
                stats[j] = { nombre: j, pj: 0, g: 0, e: 0, p: 0, dg: 0, pts: 0 };
            });

            grupoInfo.partidos.forEach(m => {
                if(stats[m.p1] && stats[m.p2]) {
                    stats[m.p1].pj++;
                    stats[m.p2].pj++;
                    stats[m.p1].dg += (m.g1 - m.g2);
                    stats[m.p2].dg += (m.g2 - m.g1);

                    if(m.g1 > m.g2) {
                        stats[m.p1].g++; stats[m.p1].pts += 3;
                        stats[m.p2].p++;
                    } else if(m.g2 > m.g1) {
                        stats[m.p2].g++; stats[m.p2].pts += 3;
                        stats[m.p1].p++;
                    } else {
                        stats[m.p1].e++; stats[m.p1].pts += 1;
                        stats[m.p2].e++; stats[m.p2].pts += 1;
                    }
                }
            });

            return Object.values(stats).sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.g - a.g);
        }

        function renderApp() {
            let allThirds = [];
            Object.keys(tournamentData.grupos).forEach(gName => {
                let st = calculateStandings(gName, tournamentData.grupos[gName]);
                if(st[2]) {
                    allThirds.push({ nombre: st[2].nombre, grupo: gName, pts: st[2].pts, dg: st[2].dg, g: st[2].g });
                }
            });

            allThirds.sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.g - a.g);
            let mejoresTercerosNombres = allThirds.slice(0, 2).map(t => t.nombre);

            // Renderizar Grupos
            let container = document.getElementById('groups-container');
            container.innerHTML = '';

            Object.keys(tournamentData.grupos).forEach(gName => {
                let standings = calculateStandings(gName, tournamentData.grupos[gName]);
                
                let html = `
                    <div class="bg-[#111827] border border-gray-800 rounded-2xl p-5 shadow-xl">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-800">
                            <div class="flex items-center space-x-3">
                                <span class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 font-bold flex items-center justify-center text-sm">${gName.split(' ')[1]}</span>
                                <h2 class="text-lg font-bold text-white">${gName}</h2>
                            </div>
                        </div>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="text-gray-400 border-b border-gray-800 text-xs">
                                        <th class="py-2 px-3 font-semibold">#</th>
                                        <th class="py-2 px-3 font-semibold">Jugador</th>
                                        <th class="py-2 px-2 text-center font-semibold">PJ</th>
                                        <th class="py-2 px-2 text-center font-semibold">G</th>
                                        <th class="py-2 px-2 text-center font-semibold">E</th>
                                        <th class="py-2 px-2 text-center font-semibold">P</th>
                                        <th class="py-2 px-2 text-center font-semibold">DG</th>
                                        <th class="py-2 px-3 text-center font-semibold">PTS</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-800/50">
                `;

                standings.forEach((st, idx) => {
                    let pos = idx + 1;
                    let borderColor = 'border-transparent';
                    if (pos <= 2) {
                        borderColor = 'border-sky-500';
                    } else if (pos === 3 && mejoresTercerosNombres.includes(st.nombre)) {
                        borderColor = 'border-amber-500';
                    }

                    html += `
                        <tr class="hover:bg-gray-800/30 transition-colors">
                            <td class="py-3 px-3 font-medium text-gray-300 relative">
                                <div class="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-r ${borderColor}"></div>
                                <span class="pl-2">${pos}</span>
                            </td>
                            <td class="py-3 px-3 font-semibold text-white">${st.nombre}</td>
                            <td class="py-3 px-2 text-center text-gray-400">${st.pj}</td>
                            <td class="py-3 px-2 text-center text-emerald-400 font-medium">${st.g}</td>
                            <td class="py-3 px-2 text-center text-amber-400 font-medium">${st.e}</td>
                            <td class="py-3 px-2 text-center text-rose-400 font-medium">${st.p}</td>
                            <td class="py-3 px-2 text-center text-gray-300">${st.dg > 0 ? '+' + st.dg : st.dg}</td>
                            <td class="py-3 px-3 text-center font-bold text-amber-400">${st.pts}</td>
                        </tr>
                    `;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            // Renderizar Lista de Resultados AGRUPADOS POR GRUPO
            let matchesList = document.getElementById('matches-list');
            matchesList.innerHTML = '';
            Object.keys(tournamentData.grupos).forEach(gName => {
                let grupo = tournamentData.grupos[gName];
                
                let groupHtml = `
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                            <h3 class="font-bold text-amber-400 text-md">${gName}</h3>
                        </div>
                `;

                grupo.partidos.forEach(m => {
                    groupHtml += `
                        <div class="flex items-center justify-between bg-gray-900/60 border border-gray-800 p-4 rounded-xl">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-gray-800 text-amber-400 border border-gray-700">${gName}</span>
                            <div class="flex items-center space-x-6 flex-1 justify-center">
                                <span class="font-bold text-white text-right w-28">${m.p1}</span>
                                <div class="bg-gray-800 px-4 py-1.5 rounded-lg border border-gray-700 font-extrabold text-amber-400 tracking-wider">
                                    ${m.g1} - ${m.g2}
                                </div>
                                <span class="font-bold text-white text-left w-28">${m.p2}</span>
                            </div>
                        </div>
                    `;
                });

                groupHtml += `</div>`;
                matchesList.innerHTML += groupHtml;
            });
        }

        function switchTab(tab) {
            const btnG = document.getElementById('btn-grupos');
            const btnR = document.getElementById('btn-resultados');
            const tabG = document.getElementById('tab-grupos');
            const tabR = document.getElementById('tab-resultados');

            if(tab === 'grupos') {
                btnG.className = "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all bg-amber-500 text-gray-950 shadow-lg shadow-amber-500/20";
                btnR.className = "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white";
                tabG.classList.remove('hidden');
                tabR.classList.add('hidden');
            } else {
                btnR.className = "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all bg-amber-500 text-gray-950 shadow-lg shadow-amber-500/20";
                btnG.className = "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white";
                tabR.classList.remove('hidden');
                tabG.classList.add('hidden');
            }
        }

        renderApp();
    </script>
</body>
</html>
